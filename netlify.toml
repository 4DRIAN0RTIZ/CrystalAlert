# The Netlify site config sets the base directory to website/, so the build
# runs from there and the publish directory is website/ itself. The library
# source lives one level up in src/ (outside the publish directory), so copy
# the files the page needs into website/vendor/ before publishing.
[build]
  base = "website"
  publish = "."
  command = "rm -rf vendor && mkdir -p vendor/themes && cp ../src/crystal-alert.js ../src/crystal-alert-styles.css vendor/ && cp ../src/themes/crystal-alert-dark.css ../src/themes/crystal-alert-minimal.css vendor/themes/"
